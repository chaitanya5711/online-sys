<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Online Quiz System</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="login-icon">
                Q
            </div>

            <h1>
                Online Quiz System
            </h1>

            <p class="login-subtitle">
                Sign in to continue
            </p>


            <!-- Login Type -->

            <div class="login-type">

                <button
                    id="teacher-btn"
                    class="login-type-btn"
                    onclick="showLogin('teacher')"
                >
                    Teacher
                </button>

                <button
                    id="student-btn"
                    class="login-type-btn"
                    onclick="showLogin('student')"
                >
                    Student
                </button>

            </div>


            <!-- Login Form -->

            <div id="login-form">

                <h2 id="login-title">
                    Student Login
                </h2>

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                    >

                </div>


                <button
                    onclick="login()"
                    class="login-button"
                >
                    Sign In
                </button>


                <p id="login-message"></p>

            </div>

        </div>

    </div>


    <script src="../js/login.js"></script>

</body>

</html>
