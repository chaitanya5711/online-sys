
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Analytics</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="dashboard-page">
        <div class="dashboard-container">

            <header class="dashboard-header">
                <div>
                    <h1>Result Analytics</h1>
                    <p>Track your quiz performance and progress.</p>
                </div>

                <div class="dashboard-actions">
                    <button class="back-button"
                        onclick="window.location.href='student.html'">
                        ← Dashboard
                    </button>
                </div>
            </header>

            <main class="dashboard-content">
                <div class="dashboard-title">
                    <div>
                        <h2>Your Performance</h2>
                        <p>Summary of your completed quizzes.</p>
                    </div>
                </div>

                <div id="analytics-content">
                    <p class="loading-message">Loading analytics...</p>
                </div>
            </main>

        </div>
    </div>

    <script>
    const userData = localStorage.getItem("user");

    if (!userData) {
        window.location.href = "login.html";
    } else {
        const user = JSON.parse(userData);

        async function loadAnalytics() {
            const container = document.getElementById("analytics-content");

            try {
                const response = await fetch(
                    `/api/analytics/${encodeURIComponent(user.id)}`
                );

                if (!response.ok) {
                    throw new Error("Could not load analytics.");
                }

                const data = await response.json();

                // Support common API response shapes.
                const stats = data.analytics || data;
                const attempts = Number(
                    stats.total_attempts ?? stats.total_quizzes ?? 0
                );
                const average = Number(
                    stats.average_percentage ?? stats.average_score ?? 0
                );
                const best = Number(
                    stats.best_percentage ?? stats.best_score ?? 0
                );

                container.innerHTML = `
                    <div class="quiz-list">
                        <div class="quiz-card">
                            <div class="quiz-card-content">
                                <h3>Quizzes Completed</h3>
                                <p>${attempts}</p>
                            </div>
                        </div>

                        <div class="quiz-card">
                            <div class="quiz-card-content">
                                <h3>Average Score</h3>
                                <p>${average.toFixed(1)}%</p>
                            </div>
                        </div>

                        <div class="quiz-card">
                            <div class="quiz-card-content">
                                <h3>Best Score</h3>
                                <p>${best.toFixed(1)}%</p>
                            </div>
                        </div>
                    </div>
                `;

            } catch (error) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>Unable to load analytics</h3>
                        <p>Please try again later.</p>
                    </div>`;
                console.error(error);
            }
        }

        loadAnalytics();
    }
    </script>
</body>
</html>
